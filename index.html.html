<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.dataset.pal=localStorage.getItem("farroya_tema_v1")||"2"}catch(e){}</script>
<title>Farroya Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Cormorant Garamond",Georgia,serif;--navy:#101D35;--on:#fff;--on2:#C5CBD5;--acc:#D9AD59;--edge:rgba(217,173,89,.6);--blue2:#243858;--silver:#C5CBD5;--gold:#D9AD59;--goldtx:#8A5F0E;--bg:#EEF1F6;--card:#fff;--ink:#101D35;--mute:#5A667C;--line:#DDE2EA;--ok:#1F7A5A;--bad:#B3392F;--blue:#2A63BF;--hd:#101D35;--btn:#101D35;--btnink:#fff;--focus:#2A63BF;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1220;--card:#14233D;--ink:#E8ECF3;--mute:#9AA6BA;--line:#263858;--goldtx:#D9AD59;--ok:#5CC9A0;--bad:#F08A80;--blue:#7FB0F5;--btn:#C5CBD5;--btnink:#101D35;--focus:#C5CBD5}}
:root[data-theme="dark"]{--bg:#0A1220;--card:#14233D;--ink:#E8ECF3;--mute:#9AA6BA;--line:#263858;--goldtx:#D9AD59;--ok:#5CC9A0;--bad:#F08A80;--blue:#7FB0F5;--btn:#C5CBD5;--btnink:#101D35;--focus:#C5CBD5}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);color:var(--on);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--edge)}
.brand{font:700 22px/1 var(--serif);letter-spacing:.16em}
.brand small{font:500 10px var(--sans);letter-spacing:.2em;color:var(--acc);margin-left:8px}
.tag{font-size:11px;color:var(--on2);margin:0}
main{max-width:640px;margin:0 auto;padding:16px 14px 96px}
h1{font:700 21px/1.2 var(--sans);margin:0 0 2px}
h2{font:700 14px/1.2 var(--sans);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:14px;background:var(--gold);border-radius:2px}
.sec{font:700 12px/1.2 var(--sans);color:var(--mute);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mute{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile,.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:inherit;font:inherit;cursor:pointer}
.tile{padding:9px 10px;border-top:3px solid var(--c,var(--silver))}
.grid .tile:nth-child(2){--c:var(--blue)}.grid .tile:nth-child(3){--c:var(--gold)}.grid .tile:nth-child(4){--c:var(--ok)}
.tile b{display:block;font:700 22px/1.1 var(--sans);margin-bottom:2px}
.tile span{color:var(--mute);font-size:11px}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--navy);color:var(--on);border:1px solid rgba(197,203,213,.3);border-left:3px solid var(--gold);padding:12px 14px}
main>section>.tile.wide{margin-top:12px}
.tile.wide b{font-size:30px;margin:0;color:var(--acc)}
.tile.wide span{color:var(--on2);font-size:12px}
.tile.wide em{display:block;font-style:normal;font-weight:700;font-size:16px;color:var(--on);margin-top:1px}
.card{margin-bottom:8px;border-left:3px solid var(--c,var(--line));padding:12px 14px}
.r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .r b{font-size:15px}
.card .r:last-child{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.card .r:last-child b{font-size:14px}
.bd{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.b{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;color:var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 14%,transparent)}
.b.s0::before,.b.s1::before,.b.s2::before,.b.s3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px}
.b.p0,.b.p1,.b.p2{background:transparent;border:1px solid var(--c);font-weight:500}
.s0{--c:var(--mute)}.s1{--c:var(--blue)}.s2{--c:var(--goldtx)}.s3{--c:var(--ok)}
.p0{--c:var(--bad)}.p1{--c:var(--goldtx)}.p2{--c:var(--ok)}
.late{color:var(--bad);font-weight:700;font-size:13px}
.soon{color:var(--goldtx);font-weight:700;font-size:13px}
.note{margin-top:20px;padding:11px 14px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;font-size:12.5px;color:var(--mute);background:var(--card)}
.note b{color:var(--ink)}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline;padding:12px 0;cursor:pointer}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
:is(input,select,textarea,button,a):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.search{margin:12px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--btn);color:var(--btnink);border-color:var(--btn);font-weight:700}
.empty{padding:28px 8px;text-align:center}
.fld{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:500;margin-bottom:4px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{padding:11px 14px;border-radius:10px;border:1px solid var(--line);border-left:3px solid var(--gold);font:700 20px/1.2 var(--sans);background:var(--card)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;padding:13px;border-radius:10px;border:1px solid var(--btn);background:var(--btn);color:var(--btnink);cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.err{color:var(--bad);font-weight:500;min-height:20px;margin:4px 0 0}
.rc{cursor:default;border-left-color:var(--gold)}
.rc .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rc .g span{display:block;font-size:11px;color:var(--mute)}
.rc .g b{font-size:13px}
.paper{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0;padding-bottom:6px}
.paper>*{margin-left:16px;margin-right:16px}
.paper .ph{background:var(--navy);color:var(--on);margin:0;padding:18px 16px 4px;font:700 20px/1.1 var(--serif);letter-spacing:.1em}
.paper .pn{background:var(--navy);color:var(--on2);margin:0 0 6px;padding:0 16px 14px;font-size:12px;border-bottom:2px solid var(--gold)}
.paper .r{padding:8px 0;border-bottom:1px solid var(--line)}
.paper p{margin-top:12px;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{font:inherit;font-size:11px;font-weight:500;background:none;border:0;color:var(--mute);padding:6px 2px;border-radius:10px;cursor:pointer;text-align:center}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 2px 0 var(--gold)}
nav .add{background:var(--navy);color:var(--on);font-weight:700;margin:0 2px;border:1px solid var(--edge)}
nav .add .i{stroke:var(--acc)}
.i{display:block;width:21px;height:21px;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on);border:1px solid var(--gold);padding:10px 18px;border-radius:10px;font-size:14px;z-index:40}
.tsw{display:flex;gap:6px;align-items:center}
.tsw::before{content:"Tema";font-size:11px;color:var(--on2);margin-right:2px}
.tsw button{width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--edge);background:transparent;color:var(--on);font:700 13px var(--sans);cursor:pointer}
.tsw button.on{background:var(--acc);color:var(--hd);border-color:var(--acc)}
html:root[data-pal="1"]{color-scheme:light;--bg:#FFF6F1;--card:#fff;--ink:#4A2E33;--mute:#86666A;--line:#F2DDD3;--navy:#F6D3C5;--hd:#F6D3C5;--on:#4A2E33;--on2:#6E4A4F;--acc:#9C4F5C;--edge:rgba(207,145,137,.9);--gold:#CF9189;--silver:#E8CFC4;--goldtx:#A5622A;--blue:#3F78AE;--ok:#3F8F6E;--bad:#C04B4B;--btn:#A85C68;--btnink:#fff;--focus:#A85C68}
html:root[data-pal="1"] .tsw button.on{color:#fff}
</style>
</head>
<body>
<header>
  <div><div class="brand">FARROYA<small>ADMIN</small></div><div class="tag">Farroya Arabic Design</div></div>
  <div class="tsw" role="group" aria-label="Pilih tema warna"><button data-p="1" aria-label="Tema 1, peach dan rose gold">1</button><button data-p="2" aria-label="Tema 2, navy dan silver">2</button></div>
</header>
<main>
  <section id="v-home"></section>
  <section id="v-recap" hidden></section>
  <section id="v-inv" hidden></section>

  <section id="v-list" hidden>
    <h1>Daftar pesanan</h1>
    <div class="mute" id="count"></div>
    <input class="search" id="q" type="search" placeholder="Cari nama pelanggan" autocomplete="off" aria-label="Cari nama pelanggan">
    <div class="chips" id="chips"></div>
    <div id="res"></div>
  </section>

  <section id="v-form" hidden>
    <h1 id="fTitle"></h1>
    <p class="mute">Sisa pembayaran dihitung otomatis dari harga dikurangi DP.</p>
    <div class="row2"><div class="fld"><label for="f_id">ID pesanan</label><input id="f_id" readonly></div>
    <div class="fld"><label for="f_admin">Admin</label><input id="f_admin" list="admins" autocomplete="off"><datalist id="admins"><option value="Fauziah"></datalist></div></div>
    <h3 class="sec">Pelanggan</h3>
    <div class="fld"><label for="f_nama">Nama pelanggan</label><input id="f_nama" autocomplete="off"></div>
    <div class="fld"><label for="f_wa">Nomor WhatsApp</label><input id="f_wa" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx"></div>
    <h3 class="sec">Pesanan dan harga</h3>
    <div class="row2"><div class="fld"><label for="f_jenis">Jenis pesanan</label><select id="f_jenis"></select></div>
    <div class="fld"><label for="f_paket">Paket</label><select id="f_paket"></select></div></div>
    <div class="row2"><div class="fld"><label for="f_harga">Harga (Rp)</label><input id="f_harga" type="number" inputmode="numeric" min="0"></div>
    <div class="fld"><label for="f_dp">DP (Rp)</label><input id="f_dp" type="number" inputmode="numeric" min="0"></div></div>
    <div class="fld"><label>Sisa pembayaran</label><div class="calc" id="sisa">Rp0</div></div>
    <h3 class="sec">Jadwal dan status</h3>
    <div class="row2"><div class="fld"><label for="f_masuk">Tanggal masuk</label><input id="f_masuk" type="date"></div>
    <div class="fld"><label for="f_deadline">Deadline</label><input id="f_deadline" type="date"></div></div>
    <div class="row2"><div class="fld"><label for="f_status">Status pengerjaan</label><select id="f_status"></select></div>
    <div class="fld"><label for="f_bayar">Status pembayaran</label><select id="f_bayar"></select></div></div>
    <h3 class="sec">Catatan dan file</h3>
    <div class="fld"><label for="f_catatan">Catatan</label><textarea id="f_catatan"></textarea></div>
    <div class="fld"><label for="f_link">Link file</label><input id="f_link" type="url" inputmode="url" placeholder="https://"></div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="bSave">Simpan pesanan</button>
    <button class="btn ghost" id="bInv">Buat invoice (PDF)</button>
    <a class="btn ghost" id="bWa" target="_blank" rel="noopener">Chat pelanggan di WhatsApp</a>
    <button class="btn ghost" id="bDel">Hapus pesanan</button>
    <button class="btn ghost" data-go="list">Batal</button>
  </section>
</main>
<nav>
  <button data-go="home" id="n-home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Beranda</button>
  <button data-go="list" id="n-list"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Pesanan</button>
  <button data-go="recap" id="n-recap"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Rekap</button>
  <button class="add" data-new="1" aria-label="Tambah pesanan"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Tambah</button>
</nav>
<div id="toast" hidden></div>
<script>
const KEY='farroya_orders_v2';
const STATUS=['Baru','Dalam Proses','Revisi','Selesai'];
const BAYAR=['Belum Bayar','DP','Lunas'];
const KATALOG={'Logo Arab':[['Paket Simple',25000],['Paket Spesial',75000],['Paket Istimewa',100000],['Paket Sempurna',150000],['Paket Kilat',200000],['Paket Filosofi',350000],['Paket Branding Kit',500000]],'Logo Wedding':[['Paket 50k',50000],['Paket 100k',100000],['Paket 150k',150000],['Paket 200k',200000],['Undangan Digital',350000]],'Kaligrafi':[['Paket 50k',50000],['Paket 100k',100000],['Paket 150k',150000],['Paket 200k',200000]]};
const JENIS=Object.keys(KATALOG);

const F=['id','nama','wa','jenis','paket','harga','dp','masuk','deadline','admin','status','bayar','catatan','link'];
const $=s=>document.querySelector(s);
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sisa=o=>Math.max(0,(+o.harga||0)-(+o.dp||0));
const sample=()=>[
{id:'FAR-001',nama:'Siti Aisyah',wa:'081234567801',jenis:'Kaligrafi',paket:'Paket 100k',harga:100000,dp:50000,masuk:day(-6),deadline:day(2),admin:'Fauziah',status:'Dalam Proses',bayar:'DP',catatan:'Nama “Aisyah Zahra”, gaya Tsuluts, warna emas di atas navy.',link:''},
{id:'FAR-002',nama:'Budi Santoso',wa:'081234567802',jenis:'Logo Arab',paket:'Paket Branding Kit',harga:500000,dp:500000,masuk:day(-14),deadline:day(-2),admin:'Fauziah',status:'Selesai',bayar:'Lunas',catatan:'Logo toko busana muslim. File final sudah dikirim.',link:'https://drive.google.com'},
{id:'FAR-003',nama:'Nur Hidayah',wa:'081234567803',jenis:'Logo Wedding',paket:'Undangan Digital',harga:350000,dp:150000,masuk:day(-8),deadline:day(1),admin:'Fauziah',status:'Revisi',bayar:'DP',catatan:'Revisi ke-1: ganti font judul dan tambah ornamen pojok.',link:''},
{id:'FAR-004',nama:'Ahmad Fauzi',wa:'081234567804',jenis:'Logo Arab',paket:'Paket Sempurna',harga:150000,dp:0,masuk:day(-1),deadline:day(9),admin:'Fauziah',status:'Baru',bayar:'Belum Bayar',catatan:'Logo toko kue, nuansa emas.',link:''},
{id:'FAR-005',nama:'Maryam Putri',wa:'081234567805',jenis:'Kaligrafi',paket:'Paket 200k',harga:200000,dp:100000,masuk:day(-3),deadline:day(5),admin:'Fauziah',status:'Dalam Proses',bayar:'DP',catatan:'Untuk hadiah pernikahan, dua nama pasangan.',link:''},
{id:'FAR-006',nama:'Rizky Pratama',wa:'081234567806',jenis:'Logo Arab',paket:'Paket Spesial',harga:75000,dp:75000,masuk:day(-10),deadline:day(-4),admin:'Fauziah',status:'Selesai',bayar:'Lunas',catatan:'',link:''}];
function load(){try{const r=localStorage.getItem(KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a))return a}}catch(e){}return[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(orders))}catch(e){}}
let orders=load(),q='',flt='Semua',edit=null,view='home';

const dl=o=>{if(o.status==='Selesai')return{t:'Selesai dikerjakan'};if(!o.deadline)return{t:'Tanpa deadline'};
 const d=new Date(o.deadline+'T00:00:00'),x=Math.round((d-new Date(day(0)+'T00:00:00'))/864e5),s=d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
 return x<0?{t:'Terlambat '+(-x)+' hari ('+s+')',late:1}:x===0?{t:'Deadline hari ini',late:1}:{t:'Deadline '+s+', '+x+' hari lagi',soon:x<=2}};
const card=o=>{const d=dl(o),s=STATUS.indexOf(o.status),p=BAYAR.indexOf(o.bayar);
 return `<button class="card s${s}" data-edit="${esc(o.id)}"><div class="r"><b>${esc(o.nama)}</b><span class="mute">${esc(o.id)}</span></div><div class="mute">${esc(o.jenis)}, ${esc(o.paket)}</div><div class="bd"><span class="b s${s}">${esc(o.status)}</span><span class="b p${p}">${esc(o.bayar)}</span></div><div class="r"><span class="${d.late?'late':d.soon?'soon':'mute'}">${d.t}</span><b>${sisa(o)>0?'Sisa '+rp(sisa(o)):'Lunas'}</b></div></button>`};

function renderHome(){
 const c=s=>orders.filter(o=>o.status===s).length,un=orders.filter(o=>sisa(o)>0),owed=un.reduce((a,o)=>a+sisa(o),0);
 const soon=orders.filter(o=>o.status!=='Selesai').sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9')).slice(0,3);
 $('#v-home').innerHTML=`<h1>Ringkasan pesanan</h1><div class="mute">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
 <div class="grid">
 <button class="tile" data-f="Semua"><b>${orders.length}</b><span>Total</span></button>
 <button class="tile" data-f="Dalam Proses"><b>${c('Dalam Proses')}</b><span>Proses</span></button>
 <button class="tile" data-f="Revisi"><b>${c('Revisi')}</b><span>Revisi</span></button>
 <button class="tile" data-f="Selesai"><b>${c('Selesai')}</b><span>Selesai</span></button>
 <button class="tile wide" data-f="unpaid"><b>${un.length}</b><div><span>Pembayaran belum lunas</span><em>Total sisa ${rp(owed)}</em></div></button></div>
 <h2>Deadline terdekat</h2>${soon.map(card).join('')||'<p class="mute">'+(orders.length?'Semua pesanan sudah selesai.':'Belum ada pesanan. Tap Tambah pesanan untuk mulai.')+'</p>'}
 <div class="note"><b>Mode prototipe.</b> Data hanya tersimpan di browser ini dan bisa hilang jika riwayat browser dibersihkan. Admin lain belum bisa melihatnya.</div>
 ${orders.length?'':'<button class="btn" id="bReset">Isi data contoh untuk mencoba</button>'}`;
}
function renderList(){
 const ch=[['Semua','Semua'],['Baru','Baru'],['Dalam Proses','Dalam Proses'],['Revisi','Revisi'],['Selesai','Selesai'],['unpaid','Belum lunas']];
 $('#chips').innerHTML=ch.map(([k,l])=>`<button class="chip${flt===k?' on':''}" data-chip="${k}">${l}</button>`).join('');
 const t=q.trim().toLowerCase();
 const r=[...orders].sort((a,b)=>b.id.localeCompare(a.id)).filter(o=>(!t||o.nama.toLowerCase().includes(t))&&(flt==='Semua'||(flt==='unpaid'?sisa(o)>0:o.status===flt)));
 $('#res').innerHTML=r.length?r.map(card).join(''):'<p class="mute empty">Tidak ada pesanan yang cocok. Ubah kata kunci atau pilih filter lain.</p>';
 $('#count').textContent=r.length+' pesanan';
}
function go(v){
 view=v;['home','list','recap','form','inv'].forEach(k=>{$('#v-'+k).hidden=k!==v;const n=$('#n-'+k);if(n)n.classList.toggle('on',k===v)});
 if(v==='home')renderHome();if(v==='recap')renderRecap();
 if(v==='list'){$('#q').value=q;renderList()}
 window.scrollTo(0,0);
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
function nextId(){const n=orders.reduce((a,o)=>Math.max(a,parseInt(String(o.id).replace(/\D/g,''))||0),0)+1;return 'FAR-'+String(n).padStart(3,'0')}
function calc(auto){
 const h=+$('#f_harga').value||0,d=+$('#f_dp').value||0;
 $('#sisa').textContent=rp(Math.max(0,h-d));
 if(auto&&(h>0||d>0))$('#f_bayar').value=d<=0?'Belum Bayar':d>=h?'Lunas':'DP';
}
function openForm(id){
 edit=id||null;
 const o=id?orders.find(x=>x.id===id):{id:nextId(),nama:'',wa:'',jenis:JENIS[0],paket:KATALOG[JENIS[0]][0][0],harga:KATALOG[JENIS[0]][0][1],dp:'',masuk:day(0),deadline:day(7),admin:'Fauziah',status:'Baru',bayar:'Belum Bayar',catatan:'',link:''};
 $('#f_jenis').value=o.jenis;fillPaket();F.forEach(k=>$('#f_'+k).value=o[k]??'');
 $('#fTitle').textContent=id?'Edit pesanan':'Tambah pesanan';
 $('#err').textContent='';calc(false);
 const w=String(o.wa||'').replace(/\D/g,'').replace(/^0/,'62');
 $('#bWa').hidden=!id||!w;$('#bWa').href='https://wa.me/'+w;$('#bDel').hidden=!id;$('#bInv').hidden=!id;
 go('form');
}
function twoTap(b,armed,fn){
 if(b.dataset.a){delete b.dataset.a;fn();return}
 b.dataset.a=1;const t=b.textContent;b.textContent=armed;
 setTimeout(()=>{delete b.dataset.a;b.textContent=t},3000);
}
function saveForm(){
 const o={};F.forEach(k=>o[k]=$('#f_'+k).value.trim());
 o.harga=+o.harga||0;o.dp=+o.dp||0;
 if(!o.nama){$('#err').textContent='Nama pelanggan wajib diisi.';$('#f_nama').focus();return}
 if(o.dp>o.harga){$('#err').textContent='DP tidak boleh lebih besar dari harga.';$('#f_dp').focus();return}
 if(edit)orders=orders.map(x=>x.id===edit?o:x);else orders.unshift(o);
 save();toast('Pesanan disimpan');
 q='';flt='Semua';go('list');
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-f],[data-chip],[data-edit],[data-new],[data-per],#bReset,#bSave,#bDel,#bInv,#bPdf');if(!t)return;
 if(t.id==='bSave')return saveForm();
 if(t.id==='bInv')return showInv(edit);
 if(t.id==='bPdf')return pdf();
 if(t.dataset.per){per=t.dataset.per;return renderRecap()}
 if(t.id==='bDel')return twoTap(t,'Tap lagi untuk menghapus',()=>{orders=orders.filter(x=>x.id!==edit);save();toast('Pesanan dihapus');go('list')});
 if(t.id==='bReset'){orders=sample();save();renderHome();return toast('Data contoh diisi')}
 if(t.dataset.new)return openForm();
 if(t.dataset.edit)return openForm(t.dataset.edit);
 if(t.dataset.f){flt=t.dataset.f;q='';return go('list')}
 if(t.dataset.chip){flt=t.dataset.chip;return renderList()}
 go(t.dataset.go);
});
let per='Bulanan',inv=null;
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'-';
const invNo=o=>'INV-'+String(o.id).replace('FAR-','');
const invLines=o=>[['Tanggal masuk',fd(o.masuk)],['Nama pelanggan',o.nama],['WhatsApp',o.wa||'-'],['Jenis pesanan',o.jenis],['Paket',o.paket],['Deadline',fd(o.deadline)],['Admin',o.admin||'-'],['Status pengerjaan',o.status],['Harga',rp(o.harga)],['DP dibayar',rp(o.dp)],['Sisa pembayaran',rp(sisa(o))],['Status pembayaran',o.bayar]];
function pkey(s){
 const d=new Date(s+'T00:00:00'),y=d.getFullYear();
 if(per==='Tahunan')return[String(y),String(y)];
 if(per==='Bulanan')return[s.slice(0,7),d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})];
 const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(m);e.setDate(m.getDate()+6);
 const f=x=>x.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
 return[ymd(m),f(m)+' - '+f(e)+' '+e.getFullYear()];
}
function renderRecap(){
 const g={};
 orders.forEach(o=>{const[k,l]=pkey(o.masuk||day(0)),x=g[k]||(g[k]={l,n:0,v:0,p:0});x.n++;x.v+=+o.harga||0;x.p+=+o.dp||0});
 const rows=Object.keys(g).sort().reverse().map(k=>g[k]),T=rows.reduce((a,x)=>({n:a.n+x.n,v:a.v+x.v,p:a.p+x.p}),{n:0,v:0,p:0});
 $('#v-recap').innerHTML=`<h1>Rekap pesanan</h1><div class="mute">Dihitung berdasarkan tanggal masuk pesanan</div>
 <div class="chips" style="margin-top:14px">${['Mingguan','Bulanan','Tahunan'].map(p=>`<button class="chip${per===p?' on':''}" data-per="${p}">${p}</button>`).join('')}</div>
 <div class="tile wide" style="cursor:default"><b>${T.n}</b><div><span>Total semua pesanan</span><em>Nilai ${rp(T.v)}</em><span>Dibayar ${rp(T.p)}, belum lunas ${rp(T.v-T.p)}</span></div></div>
 <h2>Per ${per==='Mingguan'?'minggu':per==='Bulanan'?'bulan':'tahun'}</h2>
 ${rows.map(x=>`<div class="card rc"><div class="r"><b>${x.l}</b><span class="mute">${x.n} pesanan</span></div><div class="g"><div><span>Nilai pesanan</span><b>${rp(x.v)}</b></div><div><span>Sudah dibayar</span><b>${rp(x.p)}</b></div><div><span>Belum lunas</span><b>${rp(x.v-x.p)}</b></div></div></div>`).join('')||'<p class="mute empty">Belum ada pesanan untuk direkap.</p>'}`;
}
function showInv(id){
 const o=orders.find(x=>x.id===id);if(!o)return;inv=id;
 $('#v-inv').innerHTML=`<h1>Invoice</h1><p class="mute">Bukti pesanan untuk pelanggan. Cek dulu, lalu unduh.</p>
 <div class="paper"><div class="ph">FARROYA ARABIC DESIGN</div><div class="pn">${invNo(o)}</div>${invLines(o).map(([a,b])=>`<div class="r"><span class="mute">${a}</span><b>${esc(b)}</b></div>`).join('')}<p class="mute">Pesanan Anda sudah tercatat di sistem kami. Simpan invoice ini sebagai bukti.</p></div>
 <button class="btn" id="bPdf">Unduh invoice (PDF)</button><p class="err" id="iErr" role="alert"></p>
 <button class="btn ghost" data-edit="${esc(id)}">Kembali ke pesanan</button>`;
 go('inv');
}
async function pdf(){
 const o=orders.find(x=>x.id===inv),e=$('#iErr');e.textContent='';
 try{
  const d=await claude.use('downloads');
  if(!d){e.textContent='Unduh belum tersedia di tampilan ini. Gunakan screenshot invoice di atas.';return}
  const p=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  p.setFillColor(14,27,51);p.rect(0,0,210,34,'F');
  p.setTextColor(255,255,255);p.setFont('helvetica','bold');p.setFontSize(20);p.text('FARROYA ARABIC DESIGN',15,16);
  p.setFont('helvetica','normal');p.setFontSize(10);p.setTextColor(195,202,213);p.text('Invoice / Bukti Pesanan   '+invNo(o),15,26);
  let y=52;
  invLines(o).forEach(([a,b])=>{p.setFont('helvetica','normal');p.setFontSize(10);p.setTextColor(91,103,125);p.text(a,15,y);p.setFont('helvetica','bold');p.setTextColor(14,27,51);p.text(String(b),80,y);p.setDrawColor(213,218,226);p.line(15,y+3,195,y+3);y+=10});
  p.setFont('helvetica','normal');p.setTextColor(91,103,125);p.text('Pesanan Anda sudah tercatat di sistem Farroya Arabic Design. Terima kasih.',15,y+8);
  await d.save({filename:'Invoice-'+invNo(o)+'.pdf',data:p.output('arraybuffer')});
 }catch(x){if(!x||x.code!=='declined')e.textContent='Gagal membuat PDF. Coba lagi, atau gunakan screenshot invoice.'}
}
$('#q').addEventListener('input',e=>{q=e.target.value;renderList()});
$('#f_harga').addEventListener('input',()=>calc(true));
$('#f_dp').addEventListener('input',()=>calc(true));
function fillPaket(){opt('#f_paket',(KATALOG[$('#f_jenis').value]||[]).map(p=>p[0]))}
function pickPaket(){const p=(KATALOG[$('#f_jenis').value]||[]).find(x=>x[0]===$('#f_paket').value);if(p){$('#f_harga').value=p[1];calc(true)}}
$('#f_jenis').addEventListener('change',()=>{fillPaket();pickPaket()});
$('#f_paket').addEventListener('change',pickPaket);
const opt=(id,a)=>$(id).innerHTML=a.map(x=>`<option>${esc(x)}</option>`).join('');
opt('#f_jenis',JENIS);fillPaket();opt('#f_status',STATUS);opt('#f_bayar',BAYAR);
const PK='farroya_tema_v1';
function setPal(n,keep){n=n==='1'?'1':'2';document.documentElement.dataset.pal=n;document.querySelectorAll('.tsw button').forEach(b=>b.classList.toggle('on',b.dataset.p===n));if(keep)try{localStorage.setItem(PK,n)}catch(e){}}
let pal0='2';try{pal0=localStorage.getItem(PK)||'2'}catch(e){}
setPal(pal0);
$('.tsw').addEventListener('click',e=>{const b=e.target.closest('button');if(b){setPal(b.dataset.p,1);toast('Tema '+b.dataset.p+' dipakai')}});
go('home');
</script>
</body>
</html>
