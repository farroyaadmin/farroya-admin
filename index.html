<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.dataset.pal=localStorage.getItem("farroya_tema_v2")||"1"}catch(e){}</script>
<title>Farroya Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Cormorant Garamond",Georgia,serif;--navy:#101D35;--on:#fff;--on2:#C5CBD5;--k1:#F6EAD7;--k1t:#101D35;--k2:#101D35;--k2t:#fff;--k3:#E4E9F2;--k3t:#101D35;--dbd:rgba(197,203,213,.35);--acc:#D9AD59;--edge:rgba(217,173,89,.6);--blue2:#243858;--silver:#C5CBD5;--gold:#D9AD59;--goldtx:#8A5F0E;--bg:#EEF1F6;--card:#fff;--ink:#101D35;--mute:#5A667C;--line:#DDE2EA;--ok:#1F7A5A;--bad:#B3392F;--blue:#2A63BF;--hd:#101D35;--btn:#101D35;--btnink:#fff;--focus:#2A63BF;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1220;--card:#14233D;--ink:#E8ECF3;--mute:#9AA6BA;--line:#263858;--goldtx:#D9AD59;--ok:#5CC9A0;--bad:#F08A80;--blue:#7FB0F5;--btn:#C5CBD5;--btnink:#101D35;--focus:#C5CBD5}}
:root[data-theme="dark"]{--bg:#0A1220;--card:#14233D;--ink:#E8ECF3;--mute:#9AA6BA;--line:#263858;--goldtx:#D9AD59;--ok:#5CC9A0;--bad:#F08A80;--blue:#7FB0F5;--btn:#C5CBD5;--btnink:#101D35;--focus:#C5CBD5}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);color:var(--on);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--edge)}
.brand{font:700 22px/1 var(--serif);letter-spacing:.16em}
.brand small{font:500 10px var(--sans);letter-spacing:.2em;color:var(--acc);margin-left:8px}
.tag{font-size:11px;color:var(--on2);margin:0}
main{max-width:640px;margin:0 auto;padding:16px 14px 96px}
h1{font:700 21px/1.2 var(--sans);margin:0 0 2px}
h2{font:700 14px/1.2 var(--sans);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:14px;background:var(--gold);border-radius:2px}
.sec{font:700 12px/1.2 var(--sans);color:var(--mute);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mute{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile,.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:inherit;font:inherit;cursor:pointer}
.tile{padding:9px 10px;border-top:3px solid var(--c,var(--silver))}
.grid .tile:nth-child(2){--c:var(--blue)}.grid .tile:nth-child(3){--c:var(--gold)}.grid .tile:nth-child(4){--c:var(--ok)}
.tile b{display:block;font:700 22px/1.1 var(--sans);margin-bottom:2px}
.tile span{color:var(--mute);font-size:11px}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--navy);color:var(--on);border:1px solid rgba(197,203,213,.3);border-left:3px solid var(--gold);padding:12px 14px}
main>section>.tile.wide{margin-top:12px}
.tile.wide b{font-size:30px;margin:0;color:var(--acc)}
.tile.wide span{color:var(--on2);font-size:12px}
.tile.wide em{display:block;font-style:normal;font-weight:700;font-size:16px;color:var(--on);margin-top:1px}
.card{margin-bottom:8px;border-left:3px solid var(--c,var(--line));padding:12px 14px}
.r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .r b{font-size:15px}
.card .r:last-child{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.card .r:last-child b{font-size:14px}
.bd{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.b{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;color:var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 14%,transparent)}
.b.s0::before,.b.s1::before,.b.s2::before,.b.s3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px}
.b.p0,.b.p1,.b.p2{background:transparent;border:1px solid var(--c);font-weight:500}
.s0{--c:var(--mute)}.s1{--c:var(--blue)}.s2{--c:var(--goldtx)}.s3{--c:var(--ok)}
.p0{--c:var(--bad)}.p1{--c:var(--goldtx)}.p2{--c:var(--ok)}
.late{color:var(--bad);font-weight:700;font-size:13px}
.soon{color:var(--goldtx);font-weight:700;font-size:13px}
.note{margin-top:20px;padding:11px 14px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;font-size:12.5px;color:var(--mute);background:var(--card)}
.note b{color:var(--ink)}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline;padding:12px 0;cursor:pointer}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
:is(input,select,textarea,button,a):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.search{margin:12px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;font:inherit;font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--btn);color:var(--btnink);border-color:var(--btn);font-weight:700}
.empty{padding:28px 8px;text-align:center}
.fld{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:500;margin-bottom:4px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{padding:11px 14px;border-radius:10px;border:1px solid var(--line);border-left:3px solid var(--gold);font:700 20px/1.2 var(--sans);background:var(--card)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;padding:13px;border-radius:10px;border:1px solid var(--btn);background:var(--btn);color:var(--btnink);cursor:pointer;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.err{color:var(--bad);font-weight:500;min-height:20px;margin:4px 0 0}
.rc{cursor:default;border-left-color:var(--gold)}
.rc .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rc .g span{display:block;font-size:11px;color:var(--mute)}
.rc .g b{font-size:13px}
.paper{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0;padding-bottom:6px}
.paper>*{margin-left:16px;margin-right:16px}
.paper .ph{background:var(--navy);color:var(--on);margin:0;padding:18px 16px 4px;font:700 20px/1.1 var(--serif);letter-spacing:.1em}
.paper .pn{background:var(--navy);color:var(--on2);margin:0 0 6px;padding:0 16px 14px;font-size:12px;border-bottom:2px solid var(--gold)}
.paper .r{padding:8px 0;border-bottom:1px solid var(--line)}
.paper p{margin-top:12px;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{font:inherit;font-size:11px;font-weight:500;background:none;border:0;color:var(--mute);padding:6px 2px;border-radius:10px;cursor:pointer;text-align:center}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 2px 0 var(--gold)}
nav .add{background:var(--navy);color:var(--on);font-weight:700;margin:0 2px;border:1px solid var(--edge)}
nav .add .i{stroke:var(--acc)}
.i{display:block;width:21px;height:21px;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on);border:1px solid var(--gold);padding:10px 18px;border-radius:10px;font-size:14px;z-index:40}
.tsw{display:flex;gap:6px;align-items:center}
.tsw::before{content:"Tema";font-size:11px;color:var(--on2);margin-right:2px}
.tsw button{width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--edge);background:transparent;color:var(--on);font:700 13px var(--sans);cursor:pointer}
.tsw button.on{background:var(--acc);color:var(--hd);border-color:var(--acc)}
html:root[data-pal="1"]{color-scheme:light;--bg:#F7F6F3;--card:#fff;--ink:#101D35;--mute:#5A667C;--line:#E4E1DA;--navy:#101D35;--hd:#101D35;--on:#fff;--on2:#C5CBD5;--acc:#D9AD59;--edge:rgba(217,173,89,.6);--gold:#D9AD59;--silver:#C5CBD5;--goldtx:#8A5F0E;--blue:#2A63BF;--ok:#1F7A5A;--bad:#B3392F;--btn:#101D35;--btnink:#fff;--focus:#2A63BF;--k1:#F6EAD7;--k1t:#101D35;--k2:#101D35;--k2t:#fff;--k3:#E4E9F2;--k3t:#101D35}
html:root[data-pal="2"]{color-scheme:dark;--bg:#101D35;--card:#243858;--ink:#EEF1F6;--mute:#AEB7C6;--line:#3A4D70;--navy:#243858;--hd:#0B162B;--on:#fff;--on2:#C5CBD5;--acc:#D9AD59;--edge:rgba(217,173,89,.6);--gold:#D9AD59;--silver:#C5CBD5;--goldtx:#D9AD59;--blue:#7FB0F5;--ok:#5CC9A0;--bad:#F08A80;--btn:#C5CBD5;--btnink:#101D35;--focus:#C5CBD5;--k1:#4A4030;--k1t:#F3E7CF;--k2:#0B162B;--k2t:#fff;--k3:#2E4468;--k3t:#EEF1F6}
html:root[data-pal="3"]{color-scheme:light;--bg:#FFF6F1;--card:#fff;--ink:#4A2E33;--mute:#86666A;--line:#F2DDD3;--navy:#F6D3C5;--hd:#F6D3C5;--on:#4A2E33;--on2:#6E4A4F;--acc:#9C4F5C;--edge:rgba(207,145,137,.9);--gold:#CF9189;--silver:#E8CFC4;--goldtx:#A5622A;--blue:#3F78AE;--ok:#3F8F6E;--bad:#C04B4B;--btn:#A85C68;--btnink:#fff;--focus:#A85C68;--k1:#FBE3D8;--k1t:#4A2E33;--k2:#A85C68;--k2t:#fff;--k3:#F6D3C5;--k3t:#4A2E33}
header{border-radius:0 0 24px 24px;gap:12px}
.brand{font-size:23px}
.adm{font:500 10px var(--sans);letter-spacing:.4em;color:var(--on2);margin-top:3px}
.vr{width:1px;height:34px;background:var(--edge);flex:none}
.tg{font:italic 15px Georgia,serif;color:var(--on2);flex:1;line-height:1.2}
.av{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:transparent;color:var(--on);font:700 13px var(--sans);cursor:pointer;padding:0;flex:none}
main{padding:18px 14px 150px}
.hello small{display:block;font-size:14px;color:var(--mute)}
.hello h1{font-size:24px;margin:0}
.hello p{margin:4px 0 0;font-size:13px;color:var(--mute)}
.dt{display:flex;align-items:center;gap:8px;margin-top:8px;padding:0;background:none;border:0;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;min-height:44px;text-align:left}
.dt svg{flex:none}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.kc{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);border-radius:18px;padding:12px 10px;font:inherit;cursor:pointer;min-height:178px;min-width:0}
.kc.a{background:var(--k1);color:var(--k1t)}.kc.b{background:var(--k2);color:var(--k2t)}.kc.c{background:var(--k3);color:var(--k3t)}
.kc .ic{width:36px;height:36px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;position:relative;flex:none}
.kc .bd2{position:absolute;top:-6px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:#C0392B;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.kc h3{font:700 15px/1.2 var(--sans);margin:8px 0 0}
.kc .s{font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .n{font:700 26px/1.1 var(--sans);margin-top:8px}
.kc .n small{font-size:12px;font-weight:500;opacity:.8;margin-left:3px}
.kc .v{font:700 15px/1.2 var(--sans);margin-top:10px;overflow-wrap:anywhere}
.kc .m{font-size:11px;margin-top:4px;opacity:.85}
.kc .go{margin-top:auto;padding-top:8px;border-top:1px solid rgba(127,127,127,.3);font-size:11px}
.pill{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-top:6px;background:rgba(192,57,43,.14);color:#B3392F}
.rem{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;min-height:44px}
.rem .ic{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--on);display:grid;place-items:center;flex:none}
.rem>span:nth-child(2){flex:1;min-width:0;font-size:13px}
.rem .lk{font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 10px;white-space:nowrap}
.mn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer;min-height:76px}
.qt{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--navy);color:var(--on);font:italic 15px/1.4 Georgia,serif}
.qt small{display:block;margin-top:6px;font:500 10px var(--sans);letter-spacing:.2em;color:var(--acc)}
.card.cur{border-color:var(--gold);border-left-color:var(--gold)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--gold);color:#101D35;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.28);cursor:pointer;z-index:35}
body[data-v="form"] .fab,body[data-v="inv"] .fab,body[data-v="login"] .fab{display:none}
nav{grid-template-columns:repeat(5,1fr);background:var(--hd);border-top:1px solid var(--edge);border-radius:20px 20px 0 0}
nav button{color:var(--on2);min-height:52px}
nav button.on{background:rgba(255,255,255,.1);color:var(--acc);box-shadow:none}
</style>
</head>
<body>
<header>
  <div><div class="brand">FARROYA</div><div class="adm">ADMIN</div></div><span class="vr"></span><div class="tg">Farroya Arabic Design</div><button class="av" data-go="more" aria-label="Menu Lainnya">FA</button>
</header>
<main>
  <section id="v-home"></section>
  <section id="v-login" hidden>
    <h1>Masuk</h1><p class="mute">Khusus admin Farroya. Gunakan email dan kata sandi yang sudah didaftarkan.</p>
    <div class="fld" style="margin-top:16px"><label for="l_email">Email</label><input id="l_email" type="email" inputmode="email" autocomplete="username" autocapitalize="off"></div>
    <div class="fld"><label for="l_pw">Kata sandi</label><input id="l_pw" type="password" autocomplete="current-password"></div>
    <p class="err" id="lErr" role="alert"></p>
    <button class="btn" id="bLogin">Masuk</button>
  </section>
  <section id="v-deadline" hidden></section>
  <section id="v-recap" hidden></section>
  <section id="v-more" hidden></section>
  <section id="v-cust" hidden></section>
  <section id="v-set" hidden></section>
  <section id="v-inv" hidden></section>

  <section id="v-list" hidden>
    <h1>Daftar pesanan</h1>
    <div class="mute" id="count"></div>
    <input class="search" id="q" type="search" placeholder="Cari nama pelanggan" autocomplete="off" aria-label="Cari nama pelanggan">
    <div class="chips" id="chips"></div>
    <div id="res"></div>
  </section>

  <section id="v-form" hidden>
    <h1 id="fTitle"></h1>
    <p class="mute">Sisa pembayaran dihitung otomatis dari harga dikurangi DP.</p>
    <div class="row2"><div class="fld"><label for="f_id">ID pesanan</label><input id="f_id" readonly></div>
    <div class="fld"><label for="f_admin">Admin</label><input id="f_admin" list="admins" autocomplete="off"><datalist id="admins"><option value="Fauziah"></datalist></div></div>
    <h3 class="sec">Pelanggan</h3>
    <div class="fld"><label for="f_nama">Nama pelanggan</label><input id="f_nama" autocomplete="off"></div>
    <div class="fld"><label for="f_wa">Nomor WhatsApp</label><input id="f_wa" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx"></div>
    <h3 class="sec">Pesanan dan harga</h3>
    <div class="row2"><div class="fld"><label for="f_jenis">Jenis pesanan</label><select id="f_jenis"></select></div>
    <div class="fld"><label for="f_paket">Paket</label><select id="f_paket"></select></div></div>
    <div class="row2"><div class="fld"><label for="f_harga">Harga (Rp)</label><input id="f_harga" type="number" inputmode="numeric" min="0"></div>
    <div class="fld"><label for="f_dp">DP (Rp)</label><input id="f_dp" type="number" inputmode="numeric" min="0"></div></div>
    <div class="fld"><label>Sisa pembayaran</label><div class="calc" id="sisa">Rp0</div></div>
    <h3 class="sec">Jadwal dan status</h3>
    <div class="row2"><div class="fld"><label for="f_masuk">Tanggal masuk</label><input id="f_masuk" type="date"></div>
    <div class="fld"><label for="f_deadline">Deadline</label><input id="f_deadline" type="date"></div></div>
    <div class="row2"><div class="fld"><label for="f_status">Status pengerjaan</label><select id="f_status"></select></div>
    <div class="fld"><label for="f_bayar">Status pembayaran</label><select id="f_bayar"></select></div></div>
    <h3 class="sec">Catatan dan file</h3>
    <div class="fld"><label for="f_catatan">Catatan</label><textarea id="f_catatan"></textarea></div>
    <div class="fld"><label for="f_link">Link file</label><input id="f_link" type="url" inputmode="url" placeholder="https://"></div>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="bSave">Simpan pesanan</button>
    <button class="btn ghost" id="bInv">Buat invoice (PDF)</button>
    <a class="btn ghost" id="bWa" target="_blank" rel="noopener">Chat pelanggan di WhatsApp</a>
    <button class="btn ghost" id="bDel">Hapus pesanan</button>
    <button class="btn ghost" data-go="list">Batal</button>
  </section>
</main>
<nav>
  <button data-go="home" id="n-home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:1.8"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Beranda</button>
  <button data-go="deadline" id="n-deadline"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:1.8"><path d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>Deadline</button>
  <button data-go="list" id="n-list"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:1.8"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Pesanan</button>
  <button data-go="recap" id="n-recap"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:1.8"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Rekap</button>
  <button data-go="more" id="n-more"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:3.4"><path d="M12 5.5h.01M12 12h.01M12 18.5h.01"/></svg>Lainnya</button>
</nav>
<button class="fab" data-new="1" aria-label="Tambah pesanan"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="toast" hidden></div>
<script>
const KEY='farroya_orders_v2';
const STATUS=['Baru','Dalam Proses','Revisi','Selesai'];
const BAYAR=['Belum Bayar','DP','Lunas'];
const KATALOG={'Logo Arab':[['Paket Simple',25000],['Paket Spesial',75000],['Paket Istimewa',100000],['Paket Sempurna',150000],['Paket Kilat',200000],['Paket Filosofi',350000],['Paket Branding Kit',500000]],'Logo Wedding':[['Paket 50k',50000],['Paket 100k',100000],['Paket 150k',150000],['Paket 200k',200000],['Undangan Digital',350000]],'Kaligrafi':[['Paket 50k',50000],['Paket 100k',100000],['Paket 150k',150000],['Paket 200k',200000]]};
const JENIS=Object.keys(KATALOG);

const F=['id','nama','wa','jenis','paket','harga','dp','masuk','deadline','admin','status','bayar','catatan','link'];
const $=s=>document.querySelector(s);
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sisa=o=>Math.max(0,(+o.harga||0)-(+o.dp||0));
let orders=[],q='',flt='Semua',edit=null,view='home',authed=false,userEmail='',invMode=false;

const dl=o=>{if(o.status==='Selesai')return{t:'Selesai dikerjakan'};if(!o.deadline)return{t:'Tanpa deadline'};
 const d=new Date(o.deadline+'T00:00:00'),x=Math.round((d-new Date(day(0)+'T00:00:00'))/864e5),s=d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
 return x<0?{t:'Terlambat '+(-x)+' hari ('+s+')',late:1}:x===0?{t:'Deadline hari ini',late:1}:{t:'Deadline '+s+', '+x+' hari lagi',soon:x<=2}};
const card=o=>{const d=dl(o),s=STATUS.indexOf(o.status),p=BAYAR.indexOf(o.bayar);
 return `<button class="card s${s}" data-edit="${esc(o.id)}"><div class="r"><b>${esc(o.nama)}</b><span class="mute">${esc(o.id)}</span></div><div class="mute">${esc(o.jenis)}, ${esc(o.paket)}</div><div class="bd"><span class="b s${s}">${esc(o.status)}</span><span class="b p${p}">${esc(o.bayar)}</span></div><div class="r"><span class="${d.late?'late':d.soon?'soon':'mute'}">${d.t}</span><b>${sisa(o)>0?'Sisa '+rp(sisa(o)):'Lunas'}</b></div></button>`};

const IC=(d,w)=>`<svg width="${w||18}" height="${w||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const P={cal:'M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z',box:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9',bar:'M5 20V10M12 20V4M19 20v-7',bell:'M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0',doc:'M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5M9 13h6M9 17h6',wal:'M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 10h18M16.5 14.5h.01',usr:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 20a7 7 0 0 1 14 0',set:'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4'};
const tiles=()=>[['data-inv="1"','doc','Invoice'],['data-f="unpaid"','wal','Tagihan'],['data-go="cust"','usr','Pelanggan'],['data-go="set"','set','Pengaturan']].map(([a,i,t])=>`<button class="mt" ${a}>${IC(P[i],22)}${t}</button>`).join('');
const dd=s=>Math.round((new Date(s+'T00:00:00')-new Date(day(0)+'T00:00:00'))/864e5);
function renderHome(){
 const act=orders.filter(o=>o.status!=='Selesai'),wd=act.filter(o=>o.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline));
 const owed=orders.reduce((a,o)=>a+sisa(o),0),f=wd[0],d=f?dd(f.deadline):0,urg=wd.filter(o=>dd(o.deadline)<=2).length;
 const chip=f?(d<0?'Terlambat '+(-d)+' hari':d===0?'Hari ini':d+' hari lagi'):'';
 const wk=orders.filter(o=>o.masuk&&o.masuk>=day(-7)).length,tdy=wd.filter(o=>o.deadline===day(0)).length,late=wd.filter(o=>o.deadline<day(0)).length,rev=orders.filter(o=>o.status==='Revisi').length;
 const parts=[tdy&&tdy+' deadline hari ini',late&&late+' terlambat',rev&&rev+' revisi'].filter(Boolean);
 $('#v-home').innerHTML=`<div class="hello"><small>Assalamu’alaikum,</small><h1>Selamat bekerja <span style="color:var(--gold)">✦</span></h1><p>Semoga setiap pesanan menjadi amal jariyah yang membawa keberkahan.</p></div>
 <button class="dt" data-go="deadline">${IC(P.cal)}<span><b>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b><br><span class="mute">Ketuk untuk lihat deadline ›</span></span></button>
 <div class="k3">
 <button class="kc a" data-go="deadline"><span class="ic">${IC(P.cal)}${urg?`<span class="bd2">${urg}</span>`:''}</span><h3>Deadline</h3><span class="s">${f?esc(f.nama):'Belum ada'}</span><div class="n">${wd.length}<small>aktif</small></div>${f?`<span class="pill">${chip}</span>`:''}<span class="go r"><span>Lihat semua</span><span>›</span></span></button>
 <button class="kc b" data-f="Semua"><span class="ic">${IC(P.doc)}</span><h3>Pesanan</h3><span class="s">Pesanan aktif</span><div class="n">${act.length}<small>aktif</small></div><span class="m">+${wk} minggu ini</span><span class="go r"><span>Lihat semua</span><span>›</span></span></button>
 <button class="kc c" data-go="recap"><span class="ic">${IC(P.bar)}</span><h3>Rekap</h3><span class="s">Keuangan</span><div class="v">${rp(owed)}</div><span class="m">belum lunas</span><span class="go r"><span>Lihat detail</span><span>›</span></span></button></div>
 <button class="rem" data-go="deadline"><span class="ic">${IC(P.bell)}</span><span><b>Pengingat hari ini</b><br><span class="mute">${parts.length?parts.join(' • '):'Tidak ada pengingat hari ini'}</span></span><span class="lk">Lihat semua ›</span></button>
 <div class="r" style="margin:20px 0 10px"><b>Menu lainnya</b></div><div class="mn">${tiles()}</div>
 <div class="qt">“Setiap desain adalah doa, setiap pesanan adalah amanah.”<small>FARROYA ARABIC DESIGN</small></div>`;
}
function renderDeadline(){
 const act=orders.filter(o=>o.status!=='Selesai'&&o.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline));
 const g=[['Terlambat',o=>o.deadline<day(0)],['Hari ini',o=>o.deadline===day(0)],['7 hari ke depan',o=>o.deadline>day(0)&&o.deadline<=day(7)],['Nanti',o=>o.deadline>day(7)]];
 $('#v-deadline').innerHTML='<h1>Deadline</h1><div class="mute">Pesanan yang belum selesai, urut dari yang terdekat.</div>'+(g.map(([t,fn])=>{const r=act.filter(fn);return r.length?`<h2>${t} (${r.length})</h2>`+r.map(card).join(''):''}).join('')||'<p class="mute empty">Tidak ada deadline aktif.</p>');
}
function renderMore(){$('#v-more').innerHTML='<h1>Lainnya</h1><div class="mute">Menu tambahan</div><div class="mn" style="margin-top:14px">'+tiles()+'</div>'}
function renderCust(){
 const m={};orders.forEach(o=>{const k=String(o.wa||'').replace(/\D/g,'')||String(o.nama).trim().toLowerCase(),c=m[k]||(m[k]={nama:o.nama,wa:o.wa,n:0,v:0});c.n++;c.v+=+o.harga||0});
 const r=Object.values(m).sort((a,b)=>b.n-a.n||a.nama.localeCompare(b.nama));
 $('#v-cust').innerHTML='<h1>Pelanggan</h1><div class="mute">'+r.length+' pelanggan, dihitung dari data pesanan.</div><div style="margin-top:12px">'+(r.map(c=>`<div class="card"><div class="r"><b>${esc(c.nama)}</b><span class="mute">${c.n} pesanan</span></div><div class="r"><span class="mute">${esc(c.wa||'Tanpa WhatsApp')}</span><b>${rp(c.v)}</b></div></div>`).join('')||'<p class="mute empty">Belum ada pelanggan.</p>')+'</div>';
}
function renderSet(){
 const T=[['1','Terang','Latar krem lembut, kartu putih'],['2','Gelap','Navy dengan teks silver'],['3','Peach','Peach dan rose gold']],cur=document.documentElement.dataset.pal;
 $('#v-set').innerHTML=`<h1>Pengaturan</h1><h2>Tema warna</h2>${T.map(([k,n,x])=>`<button class="card${cur===k?' cur':''}" data-pal="${k}"><div class="r"><b>${n}</b><span class="mute">${cur===k?'Dipakai':''}</span></div><div class="mute">${x}</div></button>`).join('')}<h2>Akun</h2><div class="note" style="margin-top:0">Data online dan terlihat oleh semua admin yang login. Masuk sebagai <b>${esc(userEmail)}</b>.</div><button class="btn ghost" id="bOut">Keluar dari akun</button>`;
}
function renderList(){
 const ch=[['Semua','Semua'],['Baru','Baru'],['Dalam Proses','Dalam Proses'],['Revisi','Revisi'],['Selesai','Selesai'],['unpaid','Belum lunas']];
 const n=k=>k==='Semua'?orders.length:k==='unpaid'?orders.filter(o=>sisa(o)>0).length:orders.filter(o=>o.status===k).length;$('#chips').innerHTML=ch.map(([k,l])=>`<button class="chip${flt===k?' on':''}" data-chip="${k}">${l} ${n(k)}</button>`).join('');
 const t=q.trim().toLowerCase();
 const r=[...orders].sort((a,b)=>b.id.localeCompare(a.id)).filter(o=>(!t||o.nama.toLowerCase().includes(t))&&(flt==='Semua'||(flt==='unpaid'?sisa(o)>0:o.status===flt)));
 $('#res').innerHTML=r.length?r.map(card).join(''):'<p class="mute empty">Tidak ada pesanan yang cocok. Ubah kata kunci atau pilih filter lain.</p>';
 $('#count').textContent=invMode?'Pilih pesanan untuk dibuatkan invoice':r.length+' pesanan';
}
const VIEWS=['home','deadline','list','recap','more','cust','set','form','inv','login'];
function go(v){
 view=v;if(v!=='list')invMode=false;
 document.body.classList.toggle('out',v==='login');document.body.dataset.v=v;
 VIEWS.forEach(k=>$('#v-'+k).hidden=k!==v);
 const nk={cust:'more',set:'more',inv:'more',form:'list'}[v]||v;
 document.querySelectorAll('nav button[id]').forEach(b=>b.classList.toggle('on',b.id==='n-'+nk));
 const R={home:renderHome,deadline:renderDeadline,recap:renderRecap,more:renderMore,cust:renderCust,set:renderSet,list:()=>{$('#q').value=q;renderList()}};
 if(R[v])R[v]();
 window.scrollTo(0,0);
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
function nextId(){const n=orders.reduce((a,o)=>Math.max(a,parseInt(String(o.id).replace(/\D/g,''))||0),0)+1;return 'FAR-'+String(n).padStart(3,'0')}
function calc(auto){
 const h=+$('#f_harga').value||0,d=+$('#f_dp').value||0;
 $('#sisa').textContent=rp(Math.max(0,h-d));
 if(auto&&(h>0||d>0))$('#f_bayar').value=d<=0?'Belum Bayar':d>=h?'Lunas':'DP';
}
function openForm(id){
 edit=id||null;
 const o=id?orders.find(x=>x.id===id):{id:nextId(),nama:'',wa:'',jenis:JENIS[0],paket:KATALOG[JENIS[0]][0][0],harga:KATALOG[JENIS[0]][0][1],dp:'',masuk:day(0),deadline:day(7),admin:'Fauziah',status:'Baru',bayar:'Belum Bayar',catatan:'',link:''};
 $('#f_jenis').value=o.jenis;fillPaket();F.forEach(k=>$('#f_'+k).value=o[k]??'');
 $('#fTitle').textContent=id?'Edit pesanan':'Tambah pesanan';
 $('#err').textContent='';calc(false);
 const w=String(o.wa||'').replace(/\D/g,'').replace(/^0/,'62');
 $('#bWa').hidden=!id||!w;$('#bWa').href='https://wa.me/'+w;$('#bDel').hidden=!id;$('#bInv').hidden=!id;
 go('form');
}
function twoTap(b,armed,fn){
 if(b.dataset.a){delete b.dataset.a;fn();return}
 b.dataset.a=1;const t=b.textContent;b.textContent=armed;
 setTimeout(()=>{delete b.dataset.a;b.textContent=t},3000);
}
async function saveForm(){
 const o={};F.forEach(k=>o[k]=$('#f_'+k).value.trim());
 o.harga=+o.harga||0;o.dp=+o.dp||0;
 if(!o.nama){$('#err').textContent='Nama pelanggan wajib diisi.';$('#f_nama').focus();return}
 if(o.dp>o.harga){$('#err').textContent='DP tidak boleh lebih besar dari harga.';$('#f_dp').focus();return}
 const b=$('#bSave');b.disabled=true;
 try{
  let r;
  if(edit)r=await sb.from('orders').update(o).eq('id',edit);
  else for(let i=0;i<3;i++){await loadOrders();o.id=nextId();r=await sb.from('orders').insert(o);if(!r.error||r.error.code!=='23505')break}
  if(r.error)throw r.error;
  await loadOrders();toast('Pesanan disimpan');q='';flt='Semua';go('list');
 }catch(x){$('#err').textContent='Gagal menyimpan: '+((x&&x.message)||'coba lagi')}
 b.disabled=false;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-f],[data-chip],[data-edit],[data-new],[data-per],#bReset,#bSave,#bDel,#bInv,#bPdf,#bLogin,#bOut,[data-pal],[data-inv]');if(!t)return;
 if(t.id==='bSave')return saveForm();
 if(t.id==='bInv')return showInv(edit);
 if(t.id==='bPdf')return pdf();
 if(t.dataset.per){per=t.dataset.per;return renderRecap()}
 if(t.id==='bDel')return twoTap(t,'Tap lagi untuk menghapus',()=>delOrder(edit));
 if(t.id==='bLogin')return doLogin();
 if(t.id==='bOut'){sb.auth.signOut();return}
 if(t.dataset.new)return openForm();
 if(t.dataset.pal){setPal(t.dataset.pal,1);return renderSet()}
 if(t.dataset.inv){invMode=true;q='';flt='Semua';return go('list')}
 if(t.dataset.edit)return invMode?showInv(t.dataset.edit):openForm(t.dataset.edit);
 if(t.dataset.f){flt=t.dataset.f;q='';return go('list')}
 if(t.dataset.chip){flt=t.dataset.chip;return renderList()}
 go(t.dataset.go);refresh();
});
let per='Bulanan',inv=null;
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'-';
const invNo=o=>'INV-'+String(o.id).replace('FAR-','');
const invLines=o=>[['Tanggal masuk',fd(o.masuk)],['Nama pelanggan',o.nama],['WhatsApp',o.wa||'-'],['Jenis pesanan',o.jenis],['Paket',o.paket],['Deadline',fd(o.deadline)],['Admin',o.admin||'-'],['Status pengerjaan',o.status],['Harga',rp(o.harga)],['DP dibayar',rp(o.dp)],['Sisa pembayaran',rp(sisa(o))],['Status pembayaran',o.bayar]];
function pkey(s){
 const d=new Date(s+'T00:00:00'),y=d.getFullYear();
 if(per==='Tahunan')return[String(y),String(y)];
 if(per==='Bulanan')return[s.slice(0,7),d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})];
 const m=new Date(d);m.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(m);e.setDate(m.getDate()+6);
 const f=x=>x.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
 return[ymd(m),f(m)+' - '+f(e)+' '+e.getFullYear()];
}
function renderRecap(){
 const g={};
 orders.forEach(o=>{const[k,l]=pkey(o.masuk||day(0)),x=g[k]||(g[k]={l,n:0,v:0,p:0});x.n++;x.v+=+o.harga||0;x.p+=+o.dp||0});
 const rows=Object.keys(g).sort().reverse().map(k=>g[k]),T=rows.reduce((a,x)=>({n:a.n+x.n,v:a.v+x.v,p:a.p+x.p}),{n:0,v:0,p:0});
 $('#v-recap').innerHTML=`<h1>Rekap pesanan</h1><div class="mute">Dihitung berdasarkan tanggal masuk pesanan</div>
 <div class="chips" style="margin-top:14px">${['Mingguan','Bulanan','Tahunan'].map(p=>`<button class="chip${per===p?' on':''}" data-per="${p}">${p}</button>`).join('')}</div>
 <div class="tile wide" style="cursor:default"><b>${T.n}</b><div><span>Total semua pesanan</span><em>Nilai ${rp(T.v)}</em><span>Dibayar ${rp(T.p)}, belum lunas ${rp(T.v-T.p)}</span></div></div>
 <h2>Per ${per==='Mingguan'?'minggu':per==='Bulanan'?'bulan':'tahun'}</h2>
 ${rows.map(x=>`<div class="card rc"><div class="r"><b>${x.l}</b><span class="mute">${x.n} pesanan</span></div><div class="g"><div><span>Nilai pesanan</span><b>${rp(x.v)}</b></div><div><span>Sudah dibayar</span><b>${rp(x.p)}</b></div><div><span>Belum lunas</span><b>${rp(x.v-x.p)}</b></div></div></div>`).join('')||'<p class="mute empty">Belum ada pesanan untuk direkap.</p>'}`;
}
function showInv(id){
 const o=orders.find(x=>x.id===id);if(!o)return;inv=id;
 $('#v-inv').innerHTML=`<h1>Invoice</h1><p class="mute">Bukti pesanan untuk pelanggan. Cek dulu, lalu unduh.</p>
 <div class="paper"><div class="ph">FARROYA ARABIC DESIGN</div><div class="pn">${invNo(o)}</div>${invLines(o).map(([a,b])=>`<div class="r"><span class="mute">${a}</span><b>${esc(b)}</b></div>`).join('')}<p class="mute">Pesanan Anda sudah tercatat di sistem kami. Simpan invoice ini sebagai bukti.</p></div>
 <button class="btn" id="bPdf">Unduh invoice (PDF)</button><p class="err" id="iErr" role="alert"></p>
 <button class="btn ghost" data-edit="${esc(id)}">Kembali ke pesanan</button>`;
 go('inv');
}
async function pdf(){
 const o=orders.find(x=>x.id===inv),e=$('#iErr');e.textContent='';
 try{
  const d=(window.claude&&claude.use)?await claude.use('downloads'):null;
  const p=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  p.setFillColor(14,27,51);p.rect(0,0,210,34,'F');
  p.setTextColor(255,255,255);p.setFont('helvetica','bold');p.setFontSize(20);p.text('FARROYA ARABIC DESIGN',15,16);
  p.setFont('helvetica','normal');p.setFontSize(10);p.setTextColor(195,202,213);p.text('Invoice / Bukti Pesanan   '+invNo(o),15,26);
  let y=52;
  invLines(o).forEach(([a,b])=>{p.setFont('helvetica','normal');p.setFontSize(10);p.setTextColor(91,103,125);p.text(a,15,y);p.setFont('helvetica','bold');p.setTextColor(14,27,51);p.text(String(b),80,y);p.setDrawColor(213,218,226);p.line(15,y+3,195,y+3);y+=10});
  p.setFont('helvetica','normal');p.setTextColor(91,103,125);p.text('Pesanan Anda sudah tercatat di sistem Farroya Arabic Design. Terima kasih.',15,y+8);
  const fn='Invoice-'+invNo(o)+'.pdf';if(d)await d.save({filename:fn,data:p.output('arraybuffer')});else p.save(fn);
 }catch(x){if(!x||x.code!=='declined')e.textContent='Gagal membuat PDF. Coba lagi, atau gunakan screenshot invoice.'}
}
$('#q').addEventListener('input',e=>{q=e.target.value;renderList()});
$('#f_harga').addEventListener('input',()=>calc(true));
$('#f_dp').addEventListener('input',()=>calc(true));
function fillPaket(){opt('#f_paket',(KATALOG[$('#f_jenis').value]||[]).map(p=>p[0]))}
function pickPaket(){const p=(KATALOG[$('#f_jenis').value]||[]).find(x=>x[0]===$('#f_paket').value);if(p){$('#f_harga').value=p[1];calc(true)}}
$('#f_jenis').addEventListener('change',()=>{fillPaket();pickPaket()});
$('#f_paket').addEventListener('change',pickPaket);
const opt=(id,a)=>$(id).innerHTML=a.map(x=>`<option>${esc(x)}</option>`).join('');
opt('#f_jenis',JENIS);fillPaket();opt('#f_status',STATUS);opt('#f_bayar',BAYAR);
const PK='farroya_tema_v2';
function setPal(n,keep){n=['1','2','3'].includes(n)?n:'1';document.documentElement.dataset.pal=n;if(keep)try{localStorage.setItem(PK,n)}catch(e){}}
let pal0='1';try{pal0=localStorage.getItem(PK)||'1'}catch(e){}
setPal(pal0);
const SB_URL='https://xbnpvtwvmnkhiymolorv.supabase.co',SB_KEY='sb_publishable_Ben-KEjcyCQJYT2Jmi4ngg_Ne6mwMIA';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
async function loadOrders(){const{data,error}=await sb.from('orders').select('*');if(error){toast('Gagal memuat data');return false}orders=data||[];return true}
async function refresh(){if(!authed)return;await loadOrders();if(view==='home')renderHome();else if(view==='list')renderList();else if(view==='recap')renderRecap();else if(view==='deadline')renderDeadline();else if(view==='cust')renderCust()}
async function enter(s){userEmail=s.user.email||'';authed=true;await loadOrders();go('home')}
async function doLogin(){
 if(!sb)return;
 const em=$('#l_email').value.trim(),pw=$('#l_pw').value,e=$('#lErr');e.textContent='';
 if(!em||!pw){e.textContent='Isi email dan kata sandi.';return}
 const b=$('#bLogin');b.disabled=true;b.textContent='Memeriksa...';
 const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
 b.disabled=false;b.textContent='Masuk';
 if(error){e.textContent=error.status===400?'Email atau kata sandi salah.':'Tidak bisa masuk: '+error.message;return}
 $('#l_pw').value='';await enter(data.session);
}
async function delOrder(id){const{error}=await sb.from('orders').delete().eq('id',id);if(error){toast('Gagal menghapus');return}await loadOrders();toast('Pesanan dihapus');go('list')}
async function boot(){
 if(!sb){go('login');$('#lErr').textContent='Layanan data gagal dimuat. Periksa internet, lalu muat ulang halaman.';return}
 sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){authed=false;orders=[];go('login')}});
 const{data}=await sb.auth.getSession();
 if(data.session)await enter(data.session);else go('login');
}
$('#l_pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
boot();
